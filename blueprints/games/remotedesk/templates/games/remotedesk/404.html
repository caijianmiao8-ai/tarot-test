  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --near-black: #1d1d1f;
      --gray: #6e6e73;
      --white: #ffffff;
      --blue: #097EF9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #fafbfc;
      color: var(--near-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 32px;
      border-radius: 18px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--near-black);
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--near-black);
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 16px;
      color: var(--gray);
      margin-bottom: 32px;
      max-width: 400px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .home-btn:hover {
      background: #0990FF;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(9, 126, 249, 0.25);
    }

    .home-btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
