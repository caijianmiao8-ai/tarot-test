<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 增强版世界地图 - 更详细的大陆轮廓和地形 -->
  <defs>
    <style>
      .continent {
        fill: #64748b;
        stroke: #cbd5e1;
        stroke-width: 0.8;
        opacity: 0.9;
        transition: all 0.3s ease;
      }
      .continent:hover {
        fill: #94a3b8;
        opacity: 1;
      }
      .ocean {
        fill: #1e293b;
      }
      .grid-line {
        stroke: rgba(203, 213, 225, 0.1);
        stroke-width: 0.5;
        fill: none;
      }
    </style>

    <!-- 渐变效果 -->
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="continentGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 海洋背景 -->
  <rect class="ocean" width="800" height="400" fill="url(#oceanGradient)"/>

  <!-- 经纬网格 -->
  <g class="grid">
    <line class="grid-line" x1="0" y1="100" x2="800" y2="100"/>
    <line class="grid-line" x1="0" y1="200" x2="800" y2="200"/>
    <line class="grid-line" x1="0" y1="300" x2="800" y2="300"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="400"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="400"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- 北美洲 - 更详细轮廓 -->
  <path class="continent" d="M 60 50 Q 70 45, 85 48 L 100 52 Q 115 50, 125 55 L 135 62 Q 145 60, 155 65 L 165 72 L 175 78 Q 182 75, 188 82 L 195 92 L 200 105 Q 202 115, 198 125 L 195 138 Q 193 148, 188 155 L 182 165 Q 178 172, 172 178 L 165 185 Q 158 188, 152 185 L 145 182 Q 138 178, 132 172 L 125 165 Q 118 158, 112 150 L 105 140 Q 100 130, 98 120 L 95 108 Q 92 95, 90 85 L 85 72 Q 80 60, 75 52 Q 70 48, 60 50 Z M 168 195 L 175 202 L 180 212 Q 182 220, 178 228 L 172 238 Q 168 245, 162 248 L 155 250 Q 148 248, 145 242 L 142 232 Q 140 222, 145 215 L 152 205 Q 158 198, 168 195 Z"/>

  <!-- 南美洲 - 增强细节 -->
  <path class="continent" d="M 185 218 L 192 225 L 198 235 Q 202 245, 205 255 L 208 268 Q 210 280, 208 292 L 205 305 Q 202 318, 198 328 L 192 340 Q 188 348, 182 352 L 175 356 Q 168 358, 162 355 L 155 350 Q 150 345, 148 338 L 145 328 Q 143 318, 142 308 L 140 295 Q 138 282, 140 270 L 143 258 Q 146 245, 152 235 L 158 225 Q 165 218, 175 215 Q 180 215, 185 218 Z"/>

  <!-- 欧洲 - 精细化 -->
  <path class="continent" d="M 380 85 L 388 82 L 395 80 L 402 82 L 410 85 Q 418 88, 422 95 L 425 102 Q 428 110, 428 118 L 426 128 Q 423 135, 418 140 L 410 145 Q 402 148, 395 145 L 388 142 Q 382 138, 378 132 L 375 122 Q 372 112, 373 102 L 375 95 Q 377 88, 380 85 Z"/>

  <!-- 非洲 - 更真实形状 -->
  <path class="continent" d="M 395 145 L 405 143 L 415 145 Q 425 148, 432 155 L 438 165 Q 445 175, 450 188 L 455 202 Q 458 215, 460 228 L 462 245 Q 463 260, 460 275 L 455 288 Q 450 298, 442 305 L 432 312 Q 422 316, 412 315 L 402 312 Q 392 308, 385 300 L 378 288 Q 373 275, 372 262 L 370 245 Q 368 228, 370 212 L 373 198 Q 378 182, 385 170 L 390 158 Q 393 150, 395 145 Z"/>

  <!-- 亚洲 - 大陆细节 -->
  <path class="continent" d="M 435 75 L 448 70 L 462 68 Q 478 68, 492 72 L 508 78 Q 522 85, 535 95 L 548 105 Q 560 118, 570 132 L 578 145 Q 585 158, 588 172 L 590 185 Q 590 195, 585 205 L 578 215 Q 570 222, 560 225 L 548 228 Q 535 228, 522 225 L 508 220 Q 495 212, 485 200 L 475 188 Q 468 175, 465 162 L 462 148 Q 460 135, 460 122 L 458 108 Q 455 95, 450 85 L 445 78 Q 440 75, 435 75 Z
  M 590 115 Q 598 118, 605 125 L 615 135 Q 625 145, 632 158 L 638 172 Q 642 185, 640 198 L 635 210 Q 628 218, 618 220 L 608 218 Q 598 212, 592 202 L 588 188 Q 585 175, 588 162 L 592 148 Q 595 135, 600 125 L 605 118 Q 588 112, 590 115 Z"/>

  <!-- 大洋洲/澳大利亚 - 增强 -->
  <path class="continent" d="M 620 235 L 632 232 L 645 233 Q 658 236, 668 245 L 678 255 Q 685 265, 688 278 L 690 290 Q 690 302, 685 312 L 678 322 Q 670 328, 660 330 L 648 330 Q 635 328, 625 320 L 615 308 Q 608 295, 608 280 L 610 265 Q 613 250, 620 240 Q 620 237, 620 235 Z"/>

  <!-- 东南亚岛屿群 -->
  <g opacity="0.9">
    <ellipse class="continent" cx="585" cy="238" rx="8" ry="5"/>
    <ellipse class="continent" cx="595" cy="248" rx="12" ry="7"/>
    <ellipse class="continent" cx="610" cy="242" rx="6" ry="4"/>
  </g>

  <!-- 日本列岛 -->
  <g opacity="0.9">
    <ellipse class="continent" cx="665" cy="125" rx="4" ry="15"/>
    <ellipse class="continent" cx="672" cy="135" rx="5" ry="12"/>
  </g>

  <!-- 格陵兰 -->
  <path class="continent" d="M 245 35 Q 255 32, 265 38 L 272 48 Q 275 58, 270 68 L 262 75 Q 252 78, 245 72 L 238 62 Q 235 52, 240 42 Q 242 38, 245 35 Z" opacity="0.85"/>

  <!-- 南极洲 (底部) -->
  <path class="continent" d="M 20 365 L 780 365 Q 785 368, 785 372 L 785 385 Q 785 392, 780 395 L 20 395 Q 15 392, 15 385 L 15 372 Q 15 368, 20 365 Z" opacity="0.4"/>

  <!-- 装饰性光晕 -->
  <circle cx="400" cy="200" r="300" fill="url(#continentGlow)" opacity="0.15"/>
</svg>
